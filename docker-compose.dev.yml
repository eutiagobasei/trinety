services:
  postgres:
    image: postgres:16-alpine
    container_name: trinety-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trinety
      POSTGRES_PASSWORD: trinety123
      POSTGRES_DB: trinety
    volumes:
      - trinety_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinety"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trinety-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: trinety-dev-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=trinety
      - DB_PASSWORD=trinety123
      - DB_DATABASE=trinety
      - JWT_SECRET=trinety-dev-jwt-secret-key-2024
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_EXPIRES_IN=30d
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FRONTEND_URL=http://dev.trinety.com.br
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=100
    ports:
      - "5060:3000"
    networks:
      - trinety-dev-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        - VITE_API_URL=http://dev.trinety.com.br:5060/api
    container_name: trinety-dev-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5080:80"
    networks:
      - trinety-dev-network

volumes:
  trinety_dev_postgres_data:

networks:
  trinety-dev-network:
    driver: bridge
