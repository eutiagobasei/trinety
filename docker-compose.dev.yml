services:
  traefik:
    image: traefik:v3.0
    container_name: trinety-dev-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    environment:
      - ACME_EMAIL=${ACME_EMAIL:-admin@lytos.io}
    networks:
      - trinety-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.trinety-dev.lytos.io`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"

  postgres:
    image: postgres:16-alpine
    container_name: trinety-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trinety
      POSTGRES_PASSWORD: trinety123
      POSTGRES_DB: trinety
    volumes:
      - trinety_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinety"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trinety-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: trinety-dev-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=trinety
      - DB_PASSWORD=trinety123
      - DB_DATABASE=trinety
      - JWT_SECRET=trinety-dev-jwt-secret-key-2024
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_EXPIRES_IN=30d
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - FRONTEND_URL=https://trinety-dev.lytos.io
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=100
    networks:
      - trinety-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`trinety-dev.lytos.io`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        - VITE_API_URL=https://trinety-dev.lytos.io/api
    container_name: trinety-dev-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - trinety-dev-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`trinety-dev.lytos.io`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  trinety_dev_postgres_data:

networks:
  trinety-dev-network:
    driver: bridge
